<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой календарь</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Календарь">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Личный календарь задач: что получилось, что не получилось, что хочу сделать.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('calendar-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<section id="authScreen" class="auth" hidden>
  <form id="authForm" class="auth-card" novalidate>
    <h1>Мой календарь</h1>
    <p id="authLead" class="muted">Войди, чтобы видеть свои задачи на любом устройстве.</p>
    <label>Почта<input id="authEmail" type="email" autocomplete="email" placeholder="name@mail.com"></label>
    <label>Пароль<input id="authPassword" type="password" autocomplete="current-password" placeholder="Не короче 6 символов"></label>
    <p id="authMsg" class="error" hidden></p>
    <button type="submit" id="authSubmit" class="primary wide">Войти</button>
    <button type="button" id="authSwitch" class="ghost wide">Нет аккаунта? Создать</button>
  </form>
</section>

<p id="loading" class="loading">Загружаю…</p>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="nav">
      <button id="prev" class="icon" aria-label="Прошлый месяц"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1 id="monthTitle"></h1>
      <button id="next" class="icon" aria-label="Следующий месяц"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="todayBtn" class="ghost">Сегодня</button>
    </div>
    <div class="actions">
      <button id="eveningBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Итог дня</span></button>
      <button id="summaryBtn" hidden><svg viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg><span>Итоги месяца</span></button>
      <button id="themeBtn" class="icon" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button id="logoutBtn" class="icon" aria-label="Выйти" title="Выйти"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg></button>
    </div>
  </header>

  <main class="main">
    <aside class="day">
      <div class="day-head">
        <h2 id="dayTitle"></h2>
        <p id="daySub" class="muted"></p>
      </div>

      <form id="addForm" class="add" novalidate>
        <input id="taskName" type="text" placeholder="Сходить в зал" autocomplete="off" aria-label="Что сделать">
        <div class="seg" role="radiogroup" aria-label="Время задачи">
          <button type="button" data-mode="none" class="on" role="radio" aria-checked="true">Без времени</button>
          <button type="button" data-mode="time" role="radio" aria-checked="false">Со временем</button>
        </div>
        <div id="timeFields" class="time-fields" hidden>
          <label>с <input id="startTime" type="time" value="18:00"></label>
          <label>до <input id="endTime" type="time" value="19:00"></label>
          <p id="duration" class="muted small"></p>
        </div>
        <div class="block-row">
          <select id="blockSel" aria-label="Блок месяца"></select>
          <button type="button" id="editBlocks" class="icon" aria-label="Настроить блоки месяца"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg></button>
        </div>
        <p id="formError" class="error" hidden></p>
        <button type="submit" class="primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
      </form>

      <div id="taskList" class="task-list"></div>

      <div class="legend">
        <span><i class="dot s-done"></i>получилось</span>
        <span><i class="dot s-fail"></i>не получилось</span>
        <span><i class="dot s-plan"></i>хочу сделать</span>
      </div>

      <div class="backup">
        <span id="userEmail" class="muted small"></span>
        <button type="button" id="exportBtn" class="ghost small">Скачать копию</button>
      </div>
    </aside>

    <section class="cal" aria-label="Месяц">
      <div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
      <div id="grid" class="grid"></div>
    </section>
  </main>
</div>

<dialog id="eveningDlg" class="dlg">
  <div class="dlg-head">
    <h2>Как прошёл день?</h2>
    <button type="button" class="icon close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="eveningList"></div>
  <p class="label">Что хочешь сделать завтра?</p>
  <form id="tomorrowForm" class="inline-form" novalidate>
    <input id="tomorrowName" type="text" placeholder="Дописать отчёт" autocomplete="off" aria-label="Задача на завтра">
    <button type="submit">Добавить</button>
  </form>
  <ul id="tomorrowList" class="mini-list"></ul>
  <button type="button" id="saveDay" class="primary wide">Сохранить день</button>
</dialog>

<dialog id="blocksDlg" class="dlg">
  <div class="dlg-head">
    <h2 id="blocksTitle"></h2>
    <button type="button" class="icon close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="blocksList"></div>
  <button type="button" id="addBlock" class="wide"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Новый блок</button>
  <p id="blocksTotal" class="muted small"></p>
  <button type="button" id="blocksDone" class="primary wide">Готово</button>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
